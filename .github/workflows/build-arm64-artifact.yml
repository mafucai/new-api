name: Build arm64 image artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: feature/first-topup-rebate
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Build arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag qianyue/new-api:rebate-${GITHUB_SHA} \
            --load \
            .

      - name: Export image
        run: |
          docker save qianyue/new-api:rebate-${GITHUB_SHA} | gzip -1 > new-api-arm64.tar.gz
          sha256sum new-api-arm64.tar.gz > new-api-arm64.tar.gz.sha256

      - name: Upload image artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: new-api-arm64-image
          path: |
            new-api-arm64.tar.gz
            new-api-arm64.tar.gz.sha256
          retention-days: 7

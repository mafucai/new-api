name: Build image artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: feature/first-topup-rebate
        type: string
      arch:
        description: Target architecture
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Resolve built commit
        id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker buildx build \
            --platform linux/${{ inputs.arch }} \
            --tag qianyue/new-api:rebate-${{ steps.built.outputs.sha }} \
            --load \
            .

      - name: Export image
        run: |
          docker save qianyue/new-api:rebate-${{ steps.built.outputs.sha }} | gzip -1 > new-api-${{ inputs.arch }}.tar.gz
          sha256sum new-api-${{ inputs.arch }}.tar.gz > new-api-${{ inputs.arch }}.tar.gz.sha256
          echo "Built ${{ steps.built.outputs.sha }} for linux/${{ inputs.arch }}" >> "$GITHUB_STEP_SUMMARY"
          cat new-api-${{ inputs.arch }}.tar.gz.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: new-api-${{ inputs.arch }}-image
          path: |
            new-api-${{ inputs.arch }}.tar.gz
            new-api-${{ inputs.arch }}.tar.gz.sha256
          retention-days: 7
